name: Validate Kodi Add-on

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: addon-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kodi-addon-check:
    name: addon-check (${{ matrix.kodi_branch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        kodi_branch: [nexus, omega, piers]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install kodi-addon-checker

      - name: Locate Addon and Read ID
        id: addon_meta
        run: |
          # Find where addon.xml is actually located
          XML_PATH=$(find . -name "addon.xml" -not -path "*/.*" | head -n 1)
          if [ -z "$XML_PATH" ]; then
            echo "Error: addon.xml not found in repository!"
            exit 1
          fi
          
          # Get the directory containing the xml
          ADDON_DIR=$(dirname "$XML_PATH")
          
          # Extract ID using Python
          ADDON_ID=$(python3 -c "import xml.etree.ElementTree as ET; print(ET.parse('$XML_PATH').getroot().attrib['id'])")
          
          echo "addon_id=${ADDON_ID}" >> "${GITHUB_OUTPUT}"
          echo "addon_dir=${ADDON_DIR}" >> "${GITHUB_OUTPUT}"
          echo "Found addon ${ADDON_ID} in ${ADDON_DIR}"

      - name: Prepare Clean Source Directory
        id: source_dir
        run: |
          set -euo pipefail
          WORKDIR="${RUNNER_TEMP}/addon-check-src"
          TARGET_DIR="${WORKDIR}/${{ steps.addon_meta.outputs.addon_id }}"
          mkdir -p "${TARGET_DIR}"
          
          # Sync from the discovered addon directory only
          rsync -a "${{ steps.addon_meta.outputs.addon_dir }}/" "${TARGET_DIR}/" \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude '.venv/' \
            --exclude 'venv/' \
            --exclude '.env/' \
            --exclude '__pycache__/' \
            --exclude '.pytest_cache/' \
            --exclude 'tests/' \
            --exclude '*.zip' \
            --exclude '.gitignore'
            
          echo "addon_path=${TARGET_DIR}" >> "${GITHUB_OUTPUT}"

      - name: Run addon-check
        run: |
          EXTRA_ARGS=""
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            EXTRA_ARGS="--PR"
          fi
          kodi-addon-checker "${{ steps.source_dir.outputs.addon_path }}" --branch "${{ matrix.kodi_branch }}" ${EXTRA_ARGS}

  python-syntax:
    name: Python Syntax Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile Python files
        run: |
          # Compiles everything in the repo to check for syntax errors
          python -m compileall .
